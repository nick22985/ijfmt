[package]
name = "ijfmt"
version = "0.1.0"
edition = "2024"
description = "Fast Java formatter that reads IntelliJ code style XML files"

[[bin]]
name = "ijfmt"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.26"
tree-sitter-java = "0.23"

quick-xml = "0.39"

clap = { version = "4", features = ["derive"] }

anyhow = "1"

dirs = "6"

rayon = "1"
similar = "2"

[dev-dependencies]
libtest-mimic = "0.8"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
cpu-time = "1"

[[test]]
name = "integration_test"
harness = false

[[bench]]
name = "formatter"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
